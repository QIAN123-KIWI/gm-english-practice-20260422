<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7a4d20">
  <title>5.20 业主会总经理英文讲话练习</title>
  <style>
    :root {
      --bg: #f4efe7;
      --bg-deep: #e7dccd;
      --ink: #1f2933;
      --muted: #6d665e;
      --line: rgba(92, 66, 39, 0.16);
      --panel: rgba(255, 255, 255, 0.9);
      --panel-strong: rgba(255, 255, 255, 0.98);
      --accent: #7a4d20;
      --accent-deep: #432914;
      --accent-soft: rgba(122, 77, 32, 0.1);
      --tag: #f5eadb;
      --shadow: 0 18px 44px rgba(51, 40, 30, 0.11);
      --radius: 24px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      color: var(--ink);
      font-family: "Aptos", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(circle at 100% 0%, rgba(122, 77, 32, 0.18), transparent 28%),
        radial-gradient(circle at 0% 100%, rgba(26, 54, 54, 0.14), transparent 34%),
        linear-gradient(180deg, var(--bg-deep) 0%, var(--bg) 38%, #fbf8f2 100%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.12) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.12) 1px, transparent 1px);
      background-size: 30px 30px;
      mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.36), transparent 78%);
    }

    .shell {
      width: min(1040px, calc(100% - 24px));
      margin: 16px auto 34px;
      position: relative;
      z-index: 1;
    }

    .hero, .sentence, .tips {
      background: var(--panel);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.72);
      box-shadow: var(--shadow);
    }

    .hero {
      position: relative;
      overflow: hidden;
      padding: 30px 28px 24px;
      border-radius: 30px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.96), rgba(252, 250, 246, 0.92));
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 6px;
      background: linear-gradient(90deg, rgba(122, 77, 32, 0.96), rgba(122, 77, 32, 0.16));
    }

    .eyebrow {
      margin: 0 0 10px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.12em;
      color: var(--accent);
    }

    h1 {
      margin: 0 0 14px;
      font-size: clamp(30px, 4vw, 46px);
      line-height: 1.08;
      letter-spacing: -0.03em;
    }

    .hero-copy {
      max-width: 800px;
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.85;
    }

    .tabs, .hero-meta, .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .tab, .primary-btn, .doc-link {
      appearance: none;
      border: 0;
      cursor: pointer;
      font: inherit;
      text-decoration: none;
      transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease, color 0.18s ease;
    }

    .tab:hover, .primary-btn:hover, .doc-link:hover { transform: translateY(-1px); }

    .tab {
      padding: 10px 15px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.76);
      color: var(--accent-deep);
      font-weight: 800;
    }

    .tab.active {
      background: linear-gradient(135deg, var(--accent), var(--accent-deep));
      color: #fff;
      box-shadow: 0 10px 24px rgba(92, 54, 22, 0.2);
    }

    .meta-chip, .doc-link {
      display: inline-flex;
      align-items: center;
      padding: 9px 13px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.84);
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .doc-link {
      color: var(--accent-deep);
      background: var(--accent-soft);
    }

    .primary-btn {
      padding: 14px 24px;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--accent), var(--accent-deep));
      color: #fff;
      font-weight: 800;
      font-size: 15px;
      letter-spacing: 0.01em;
      box-shadow: 0 12px 28px rgba(92, 54, 22, 0.24);
    }

    .status {
      min-height: 22px;
      color: var(--muted);
      font-size: 15px;
      font-weight: 700;
    }

    .guide-note {
      display: inline-flex;
      margin: 16px 0 0;
      padding: 10px 14px;
      border-radius: 16px;
      border: 1px solid rgba(122, 77, 32, 0.12);
      background: rgba(255, 255, 255, 0.72);
      color: #5d544b;
      font-size: 14px;
      line-height: 1.75;
    }

    .list {
      display: grid;
      gap: 14px;
      margin-top: 22px;
    }

    .loading-card {
      padding: 18px 20px;
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.72);
      border: 1px dashed rgba(122, 77, 32, 0.18);
      color: var(--muted);
      font-size: 15px;
      line-height: 1.8;
    }

    .sentence {
      position: relative;
      overflow: hidden;
      padding: 24px 22px 24px;
      border-radius: var(--radius);
      border: 1px solid rgba(122, 77, 32, 0.08);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.96), rgba(250, 247, 240, 0.94));
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    }

    .sentence::before {
      content: "";
      position: absolute;
      left: 0;
      top: 18px;
      bottom: 18px;
      width: 4px;
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(122, 77, 32, 0.94), rgba(122, 77, 32, 0.18));
    }

    .sentence.active {
      border-color: rgba(122, 77, 32, 0.34);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(247, 238, 223, 0.98));
      box-shadow: 0 20px 42px rgba(92, 54, 22, 0.14);
    }

    .sentence-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .left-controls {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .clip-btn {
      min-width: 148px;
      padding: 11px 18px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent-deep);
      font-size: 14px;
      font-weight: 800;
      text-align: center;
    }

    .clip-btn[disabled] {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .sentence.active .clip-btn:not([disabled]) {
      background: linear-gradient(135deg, var(--accent), var(--accent-deep));
      color: #fff;
    }

    .seq {
      display: inline-flex;
      align-items: center;
      padding: 8px 12px;
      border-radius: 999px;
      background: var(--tag);
      color: var(--accent-deep);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.02em;
    }

    .timecode {
      font-size: 13px;
      color: var(--muted);
      letter-spacing: 0.04em;
      font-variant-numeric: tabular-nums;
      font-weight: 700;
    }

    .copy-labels {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }

    .copy-label {
      display: inline-flex;
      align-items: center;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .copy-label-en {
      background: rgba(122, 77, 32, 0.1);
      color: var(--accent-deep);
    }

    .copy-label-zh {
      background: rgba(105, 96, 86, 0.12);
      color: #5b554e;
    }

    .en {
      margin: 0;
      font-family: "Palatino Linotype", "Book Antiqua", Georgia, serif;
      font-size: clamp(22px, 2.6vw, 31px);
      line-height: 1.44;
      letter-spacing: 0.01em;
      word-break: break-word;
    }

    .zh {
      margin: 14px 0 0;
      color: #5b554e;
      font-size: clamp(18px, 2.2vw, 21px);
      line-height: 1.82;
      font-weight: 500;
      word-break: break-word;
    }

    .tips {
      margin-top: 22px;
      padding: 22px 22px 24px;
      border-radius: var(--radius);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.96), rgba(249, 246, 238, 0.94));
    }

    .tips h2 {
      margin: 0 0 12px;
      font-size: 18px;
    }

    .tips-list {
      margin: 0;
      padding-left: 22px;
      color: #5b554e;
      line-height: 1.9;
      font-size: 15px;
    }

    @media (max-width: 760px) {
      .shell {
        width: min(100% - 14px, 1040px);
        margin: 10px auto 24px;
      }
      .hero {
        padding: 22px 16px 18px;
        border-radius: 24px;
      }
      h1 {
        font-size: clamp(24px, 8vw, 34px);
        line-height: 1.14;
      }
      .hero-copy {
        font-size: 15px;
        line-height: 1.8;
      }
      .guide-note {
        display: block;
      }
      .sentence {
        padding: 18px 16px 18px;
        border-radius: 20px;
      }
      .sentence::before {
        top: 16px;
        bottom: 16px;
      }
      .left-controls {
        width: 100%;
      }
      .clip-btn {
        flex: 1 1 auto;
        min-width: 0;
      }
      .timecode {
        width: 100%;
      }
      .tips {
        padding: 18px 16px 20px;
        border-radius: 20px;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="hero">
      <p class="eyebrow">5.20 业主会 · 总经理英文讲话练习</p>
      <h1 id="page-title">总经理英文讲话中英对照点播</h1>
      <p class="hero-copy" id="topic-summary">选择专题后，可以整段听英文男声，也可以按 Word 段落逐段点播。</p>
      <div class="tabs" id="tabs" aria-label="专题切换"></div>
      <div class="hero-meta" id="meta"></div>
      <div class="controls">
        <button class="primary-btn" id="play-full" type="button">播放本专题英文男声</button>
        <a class="doc-link" id="doc-link" href="#" download>下载配套 Word 稿</a>
        <div class="status" id="status">页面加载中，马上为你准备逐段练习。</div>
      </div>
      <p class="guide-note">使用方法：上方切换两个专题；点击“播放本专题英文男声”听完整英文版；点击每张卡片左上角按钮，点播对应段落男声英文。</p>
    </section>

    <section class="list" id="list" aria-live="polite">
      <div class="loading-card">正在加载练习内容… 如果网络稍慢，请等待 1-2 秒。</div>
    </section>

    <section class="tips">
      <h2>练习建议</h2>
      <ol class="tips-list">
        <li>Word 适合看正式稿，网页适合反复点听男声英文。</li>
        <li>先听整段抓汇报逻辑，再逐段模仿停顿、重音和尾音。</li>
        <li>中文用于快速核对意思，练习时优先跟英文原声节奏走。</li>
      </ol>
    </section>
  </main>

  <script>
    const TEXT = {
      playClip: "播放英文原段",
      noAudio: "无男声切片",
      labelZh: "中文理解",
      statusLoading: "页面加载中，马上为你准备逐段练习。",
      statusLoaded: (count, clips) => `页面已加载完成，共 ${count} 段，${clips} 段带男声切片。`,
      statusLoadFailed: "页面数据加载失败，请刷新重试。",
      statusPlayingFull: "正在播放本专题英文男声合集。",
      statusPlayingClip: (id, range) => `正在播放第 ${String(id).padStart(2, "0")} 段英文男声 · ${range}`,
      statusClipDone: (id) => `第 ${String(id).padStart(2, "0")} 段播放结束，可再次点击重播。`,
      statusFullDone: "本专题英文男声播放结束，可以继续逐段练习。",
      statusPlayFailed: "当前音频暂时未能播放，请再点一次试试。"
    };

    const tabs = document.getElementById("tabs");
    const meta = document.getElementById("meta");
    const list = document.getElementById("list");
    const status = document.getElementById("status");
    const playFullButton = document.getElementById("play-full");
    const docLink = document.getElementById("doc-link");
    const pageTitle = document.getElementById("page-title");
    const topicSummary = document.getElementById("topic-summary");

    let topics = [];
    let currentTopic = null;
    let segments = [];
    let fullPlayer = new Audio();
    let clipPlayers = new Map();
    let warmedClipIds = new Set();
    let segmentMap = new Map();
    let activeId = null;
    let currentClip = null;
    let observer = null;

    const connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection || null;
    const allowAggressiveWarmup = !connection || (!connection.saveData && !/2g/.test(connection.effectiveType || ""));
    const initialWarmCount = allowAggressiveWarmup ? 5 : 2;

    function updateStatus(text) {
      status.textContent = text;
    }

    function escapeHtml(text) {
      return String(text || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = seconds - mins * 60;
      const whole = Math.floor(secs);
      const millis = Math.min(999, Math.round((secs - whole) * 1000));
      return `${String(mins).padStart(2, "0")}:${String(whole).padStart(2, "0")}.${String(millis).padStart(3, "0")}`;
    }

    function formatRange(start, end) {
      if (!end || end <= start) return "无可用时间戳";
      return `${formatTime(start)} - ${formatTime(end)}`;
    }

    function setActive(id) {
      activeId = id;
      document.querySelectorAll(".sentence").forEach((card) => {
        card.classList.toggle("active", Number(card.dataset.id) === id);
      });
    }

    function stopClip() {
      if (!currentClip) return;
      currentClip.pause();
      currentClip.currentTime = 0;
      currentClip = null;
    }

    function stopFull() {
      fullPlayer.pause();
      fullPlayer.currentTime = 0;
    }

    function warmFullAudio() {
      fullPlayer.preload = allowAggressiveWarmup ? "auto" : "metadata";
      fullPlayer.load();
    }

    function clipUrl(segment) {
      return `${currentTopic.base_path}/${segment.audio_file}`;
    }

    function getClipPlayer(segment) {
      if (!clipPlayers.has(segment.id)) {
        const player = new Audio(clipUrl(segment));
        player.preload = "metadata";
        player.addEventListener("ended", () => {
          if (currentClip === player) {
            currentClip = null;
            updateStatus(TEXT.statusClipDone(segment.id));
          }
        });
        player.addEventListener("error", () => {
          if (currentClip === player) {
            currentClip = null;
            updateStatus(TEXT.statusPlayFailed);
          }
        });
        clipPlayers.set(segment.id, player);
      }
      return clipPlayers.get(segment.id);
    }

    function warmClip(segment, eager = false) {
      if (!segment || !segment.audio_file || warmedClipIds.has(segment.id)) return;
      warmedClipIds.add(segment.id);
      const player = getClipPlayer(segment);
      player.preload = eager ? "auto" : "metadata";
      player.load();
    }

    function scheduleWarmup(callback) {
      if ("requestIdleCallback" in window) {
        window.requestIdleCallback(callback, { timeout: 1500 });
      } else {
        window.setTimeout(callback, 300);
      }
    }

    function setupObserver() {
      if (observer) observer.disconnect();
      if (!("IntersectionObserver" in window)) return;
      observer = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (!entry.isIntersecting) return;
          const id = Number(entry.target.dataset.id);
          warmClip(segmentMap.get(id), allowAggressiveWarmup);
          observer.unobserve(entry.target);
        });
      }, { rootMargin: "220px 0px" });
      document.querySelectorAll(".sentence").forEach((card) => observer.observe(card));
    }

    async function playFull() {
      stopClip();
      setActive(null);
      fullPlayer.currentTime = 0;
      try {
        await fullPlayer.play();
        updateStatus(TEXT.statusPlayingFull);
      } catch (error) {
        updateStatus(TEXT.statusPlayFailed);
      }
    }

    async function playClip(segment) {
      if (!segment.audio_file) return;
      stopFull();
      const player = getClipPlayer(segment);
      if (currentClip && currentClip !== player) stopClip();
      currentClip = player;
      setActive(segment.id);
      player.currentTime = 0;
      try {
        await player.play();
        updateStatus(TEXT.statusPlayingClip(segment.id, formatRange(segment.start, segment.end)));
      } catch (error) {
        updateStatus(TEXT.statusPlayFailed);
      }
    }

    function renderSegments() {
      list.innerHTML = "";
      segments.forEach((segment) => {
        const article = document.createElement("article");
        article.className = "sentence";
        article.dataset.id = segment.id;
        const hasAudio = Boolean(segment.audio_file);
        article.innerHTML = `
          <div class="sentence-head">
            <div class="left-controls">
              <button class="clip-btn" type="button" ${hasAudio ? "" : "disabled"}>${hasAudio ? TEXT.playClip : TEXT.noAudio}</button>
              <span class="seq">第 ${String(segment.id).padStart(2, "0")} 段</span>
            </div>
            <span class="timecode">${formatRange(segment.start, segment.end)}</span>
          </div>
          <div class="copy-labels">
            <span class="copy-label copy-label-en">English Original</span>
            <span class="copy-label copy-label-zh">${TEXT.labelZh}</span>
          </div>
          <p class="en">${escapeHtml(segment.en)}</p>
          <p class="zh">${escapeHtml(segment.zh)}</p>
        `;
        const button = article.querySelector(".clip-btn");
        if (hasAudio) {
          button.addEventListener("pointerdown", () => warmClip(segment, true), { passive: true });
          button.addEventListener("touchstart", () => warmClip(segment, true), { passive: true });
          button.addEventListener("mouseenter", () => warmClip(segment, false));
          button.addEventListener("focus", () => warmClip(segment, false));
          button.addEventListener("click", () => playClip(segment));
        }
        list.appendChild(article);
      });
    }

    function renderTopicChrome() {
      pageTitle.textContent = `${currentTopic.title} · 总经理英文讲话练习`;
      topicSummary.textContent = currentTopic.summary;
      docLink.href = currentTopic.docx_file;
      fullPlayer = new Audio(`${currentTopic.base_path}/full.mp3`);
      fullPlayer.preload = "metadata";
      fullPlayer.addEventListener("ended", () => updateStatus(TEXT.statusFullDone));
      fullPlayer.addEventListener("error", () => updateStatus(TEXT.statusPlayFailed));
      meta.innerHTML = `
        <span class="meta-chip">${currentTopic.english_title}</span>
        <span class="meta-chip">${currentTopic.segment_count} 段中英对照</span>
        <span class="meta-chip">${currentTopic.clip_count} 段男声切片</span>
      `;
      tabs.querySelectorAll(".tab").forEach((tab) => {
        tab.classList.toggle("active", tab.dataset.slug === currentTopic.slug);
      });
    }

    async function loadTopic(topic) {
      currentTopic = topic;
      segments = [];
      segmentMap = new Map();
      clipPlayers = new Map();
      warmedClipIds = new Set();
      stopClip();
      stopFull();
      setActive(null);
      renderTopicChrome();
      updateStatus(TEXT.statusLoading);
      list.innerHTML = '<div class="loading-card">正在加载练习内容… 如果网络稍慢，请等待 1-2 秒。</div>';
      try {
        const response = await fetch(`${topic.base_path}/segments.json`, { cache: "force-cache" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        segments = await response.json();
        segments.forEach((segment) => segmentMap.set(segment.id, segment));
        renderSegments();
        warmFullAudio();
        scheduleWarmup(() => {
          segments.filter((segment) => segment.audio_file).slice(0, initialWarmCount).forEach((segment) => warmClip(segment, true));
        });
        setupObserver();
        updateStatus(TEXT.statusLoaded(segments.length, segments.filter((segment) => segment.audio_file).length));
      } catch (error) {
        list.innerHTML = '<div class="loading-card">加载失败，请刷新页面重试。</div>';
        updateStatus(TEXT.statusLoadFailed);
      }
    }

    function renderTabs() {
      tabs.innerHTML = "";
      topics.forEach((topic) => {
        const button = document.createElement("button");
        button.className = "tab";
        button.type = "button";
        button.dataset.slug = topic.slug;
        button.textContent = topic.title;
        button.addEventListener("click", () => loadTopic(topic));
        tabs.appendChild(button);
      });
    }

    async function bootstrap() {
      updateStatus(TEXT.statusLoading);
      try {
        const response = await fetch("topics.json", { cache: "force-cache" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        topics = await response.json();
        renderTabs();
        const hashSlug = decodeURIComponent(location.hash.replace(/^#/, ""));
        const initialTopic = topics.find((topic) => topic.slug === hashSlug) || topics[0];
        await loadTopic(initialTopic);
      } catch (error) {
        list.innerHTML = '<div class="loading-card">加载失败，请刷新页面重试。</div>';
        updateStatus(TEXT.statusLoadFailed);
      }
    }

    playFullButton.addEventListener("pointerdown", warmFullAudio, { passive: true });
    playFullButton.addEventListener("touchstart", warmFullAudio, { passive: true });
    playFullButton.addEventListener("click", playFull);

    bootstrap();
  </script>
</body>
</html>
